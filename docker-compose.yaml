version: "3.8"

services:
  app:
    image: ghcr.io/ly921002/x-cf:reality
    container_name: x-cf-reality
    restart: unless-stopped
    network_mode: host
    environment:
      UUID: ""
      XRAY_PORT: 443
      XHTTP_PATH_BASE: "/api/v1"
      XHTTP_PATH_LEN: 8
      SERVER_NAME: "www.apple.com"
